<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>やさしい一分の設定</title>
<style>
  body{font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;background:#f7f5ef;color:#24302a;max-width:560px;margin:32px auto;padding:0 16px;line-height:1.7}
  h1{font-size:20px}
  label{display:block;margin-top:18px;font-weight:600}
  .hint{font-size:13px;opacity:.7;font-weight:400}
  textarea,input[type=number]{font:inherit;border:1px solid #c9d3cc;border-radius:8px;padding:8px;background:#fff;color:#24302a;box-sizing:border-box}
  textarea{width:100%;min-height:110px}
  input[type=number]{width:100px}
  button{font:inherit;border:0;border-radius:999px;padding:10px 22px;margin-top:22px;cursor:pointer;background:#4f7a62;color:#fff}
  #status{margin-left:10px;font-size:14px}
</style>
</head>
<body>
  <h1>やさしい一分の設定</h1>
  <p>自動で休憩を提案するのは、下に書いたサイトだけです。空のままなら自動提案はしません。データはすべてこのブラウザ内に保存され、外部には送信しません。</p>

  <label>自動で休憩を提案するサイト <span class="hint">（1行に1つ。例：x.com）</span></label>
  <textarea id="sites" placeholder="x.com&#10;youtube.com"></textarea>

  <label>提案するまでのスクロール量 <span class="hint">（画面何枚分）</span></label>
  <input type="number" id="scrollScreens" min="5" max="500">

  <label>次の提案までの間隔 <span class="hint">（分）</span></label>
  <input type="number" id="cooldownMinutes" min="1" max="600">

  <label><input type="checkbox" id="sound"> 休憩の終わりに小さな音を鳴らす</label>

  <button id="save">保存</button><span id="status"></span>
  <script type="module" src="options.js"></script>
</body>
</html>
